<aside class="admin-sidebar">
  <div class="admin-sidebar__brand">
    <span class="admin-sidebar__logo">🛒</span>
    <span class="admin-sidebar__title">Admin Panel</span>
  </div>

  <nav class="admin-sidebar__nav">
    @for (item of navItems; track item.href) {
      <a
        [routerLink]="item.href"
        class="admin-sidebar__link"
        [class.admin-sidebar__link--active]="isActive(item.href)"
      >
        <span class="admin-sidebar__icon">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="admin-sidebar__footer">
    <a routerLink="/" class="admin-sidebar__link admin-sidebar__link--footer">
      <span class="admin-sidebar__icon">🛒</span>
      Ver Tienda
    </a>
    <button type="button" class="admin-sidebar__link admin-sidebar__link--footer admin-sidebar__btn" (click)="logout()">
      <span class="admin-sidebar__icon">↪</span>
      Cerrar Sesión
    </button>
  </div>
</aside>
