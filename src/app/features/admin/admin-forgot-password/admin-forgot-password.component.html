<div class="admin-forgot">
  <div class="admin-forgot__card">
    <h1 class="admin-forgot__title">Recuperar contraseña</h1>
    <p class="admin-forgot__subtitle">Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.</p>
    <form (ngSubmit)="handleSubmit()" class="admin-forgot__form">
      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
        name="email"
        required
        class="admin-input"
      />
      <button type="submit" class="admin-btn admin-btn--primary" style="width: 100%;" [disabled]="isLoading">
        {{ isLoading ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    </form>
  </div>
</div>
