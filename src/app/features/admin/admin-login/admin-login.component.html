<div class="admin-login">
  <div class="admin-login__card">
    <h1 class="admin-login__title">Panel Admin</h1>
    <p class="admin-login__subtitle">Inicia sesión para continuar</p>
    <form class="admin-login__form">
      <input type="email" placeholder="Email" class="admin-input" />
      <input type="password" placeholder="Contraseña" class="admin-input" />
      <button type="submit" class="admin-btn admin-btn--primary" style="width: 100%;">Entrar</button>
    </form>
    <a routerLink="/admin/dashboard" class="admin-login__link">Volver al panel</a>
  </div>
</div>
