<div class="ecommerce-layout">
  <app-store-header></app-store-header>

  <main class="ecommerce-main">
    <div class="products-header">
      <div class="container">
        <h1 class="products-header__title">Todos los Productos</h1>
        <p class="products-header__subtitle">Descubre nuestra colección completa</p>
      </div>
    </div>

    <div class="container products-content">
      <aside class="products-sidebar">
        <app-product-filters
          [categories]="categories"
          [search]="search"
          [selectedCategoryIds]="selectedCategoryIds"
          (searchChange)="onSearchChange($event)"
          (categoriesChange)="onCategoriesChange($event)"
        />
      </aside>
      <div class="products-grid-wrap">
        @if (loading) {
          <p class="products-loading">Cargando productos…</p>
        } @else if (error) {
          <p class="products-error">{{ error }}</p>
        } @else {
          <app-product-grid
            [products]="products"
            [totalCount]="totalCount"
            [pageNumber]="pageNumber"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
          />
        }
      </div>
    </div>
  </main>

  <app-store-footer></app-store-footer>
</div>
