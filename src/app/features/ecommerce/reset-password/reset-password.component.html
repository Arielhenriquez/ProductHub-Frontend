<div class="reset-page">
  <div class="reset-page__inner">
    <div class="reset-card">
      <h1 class="reset-card__title">Cambiar contraseña</h1>
      <form (ngSubmit)="handleSubmit()" class="reset-form">
        <div class="reset-form__group">
          <label for="password">Contraseña</label>
          <div class="reset-form__input-wrap">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Nueva contraseña"
              required
              [(ngModel)]="password"
              name="password"
              class="reset-form__input"
            />
            <button type="button" class="reset-form__toggle" (click)="showPassword = !showPassword" aria-label="Ver contraseña">
              {{ showPassword ? '🙈' : '👁' }}
            </button>
          </div>
        </div>
        <div class="reset-form__group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="reset-form__input-wrap">
            <input
              id="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              placeholder="Repite la contraseña"
              required
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              class="reset-form__input"
            />
            <button type="button" class="reset-form__toggle" (click)="showConfirmPassword = !showConfirmPassword" aria-label="Ver contraseña">
              {{ showConfirmPassword ? '🙈' : '👁' }}
            </button>
          </div>
        </div>
        <button type="submit" class="reset-form__submit" [disabled]="isLoading">
          {{ isLoading ? 'Guardando...' : 'Guardar' }}
        </button>
      </form>
      <a routerLink="/login" class="reset-form__link">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
