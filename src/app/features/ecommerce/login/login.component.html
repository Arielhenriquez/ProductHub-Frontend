<div class="login-page">
  <div class="login-page__inner">
    <div class="login-page__header">
      <a routerLink="/" class="login-page__logo">
        <span class="login-page__logo-icon">🛒</span>
        <span class="login-page__brand">ShopHub</span>
      </a>
      <h1 class="login-page__title">Bienvenido</h1>
      <p class="login-page__subtitle">Inicia sesión para seguir explorando</p>
    </div>

    <div class="login-card">
      <div class="login-card__header">
        <h2 class="login-card__title">Iniciar sesión</h2>
        <p class="login-card__subtitle">Ingresa tu email y contraseña</p>
      </div>
      <div class="login-card__body">
        <form (ngSubmit)="handleSubmit()" class="login-form">
          <div class="login-form__group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="tu@ejemplo.com" required [(ngModel)]="formData.email" name="email" />
          </div>
          <div class="login-form__group">
            <label for="password">Contraseña</label>
            <div class="login-form__input-wrap">
              <input id="password" [type]="showPassword ? 'text' : 'password'" placeholder="Tu contraseña" required [(ngModel)]="formData.password" name="password" />
              <button type="button" class="login-form__toggle" (click)="showPassword = !showPassword" aria-label="Ver contraseña">{{ showPassword ? '🙈' : '👁' }}</button>
            </div>
          </div>
          <label class="login-form__checkbox">
            <input type="checkbox" [(ngModel)]="formData.rememberMe" name="rememberMe" />
            <span>Recordarme 30 días</span>
          </label>
          <button type="submit" class="login-form__submit" [disabled]="isLoading">
            {{ isLoading ? 'Entrando...' : 'Iniciar sesión' }}
          </button>
        </form>

        <div class="login-card__divider">
          <span>¿Nuevo aquí?</span>
        </div>
        <a routerLink="/register" class="login-form__link-btn">Crear cuenta</a>
      </div>
    </div>

    <p class="login-page__footer">
      <a routerLink="/">Volver a la tienda</a>
    </p>
  </div>
</div>
