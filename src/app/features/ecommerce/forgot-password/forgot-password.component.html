<div class="forgot-page">
  <div class="forgot-page__inner">
    <div class="forgot-page__header">
      <a routerLink="/" class="forgot-page__logo">
        <span class="forgot-page__logo-icon">🛒</span>
        <span class="forgot-page__brand">ShopHub</span>
      </a>
      <h1 class="forgot-page__title">Recuperar contraseña</h1>
      <p class="forgot-page__subtitle">
        Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.
      </p>
    </div>

    <div class="forgot-card">
      <div class="forgot-card__header">
        <h2 class="forgot-card__title">¿Olvidaste tu contraseña?</h2>
        <p class="forgot-card__subtitle">Ingresa el email asociado a tu cuenta</p>
      </div>
      <div class="forgot-card__body">
        <form (ngSubmit)="handleSubmit()" class="forgot-form">
          <div class="forgot-form__group">
            <label for="email">Email *</label>
            <input
              id="email"
              type="email"
              placeholder="tu@ejemplo.com"
              required
              [(ngModel)]="email"
              name="email"
              class="forgot-form__input"
            />
          </div>
          <button type="submit" class="forgot-form__submit" [disabled]="isLoading">
            {{ isLoading ? 'Enviando...' : 'Enviar enlace' }}
          </button>
        </form>

        <div class="forgot-card__divider">
          <span>¿Recordaste tu contraseña?</span>
        </div>
        <a routerLink="/login" class="forgot-form__link-btn">Volver al inicio de sesión</a>
      </div>
    </div>
  </div>
</div>
