<div class="product-filters">
  <div class="product-filters__header">
    <h3 class="product-filters__title">Filtros</h3>
    <button type="button" class="product-filters__clear" (click)="clearFilters()">Limpiar</button>
  </div>
  <div class="product-filters__body">
    <div class="product-filters__group">
      <h4 class="product-filters__label">Buscar</h4>
      <input
        type="text"
        class="product-filters__search"
        [value]="search()"
        (input)="onSearchInput($any($event.target).value)"
        placeholder="Nombre del producto…"
      />
    </div>
    <div class="product-filters__group">
      <h4 class="product-filters__label">Categorías</h4>
      @for (category of categoryList; track category.id) {
        <label class="product-filters__checkbox">
          <input
            type="checkbox"
            [checked]="isCategorySelected(category.id)"
            (change)="toggleCategory(category.id)"
          />
          <span>{{ category.name }}</span>
        </label>
      }
      @if (categoryList.length === 0) {
        <p class="product-filters__empty">No hay categorías</p>
      }
    </div>
    <div class="product-filters__group">
      <h4 class="product-filters__label">Precio máximo</h4>
      <div class="product-filters__range">
        <input type="range" min="0" max="1000" step="10" [(ngModel)]="priceMax" />
        <div class="product-filters__range-labels">
          <span>$0</span>
          <span>${{ priceMax }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
