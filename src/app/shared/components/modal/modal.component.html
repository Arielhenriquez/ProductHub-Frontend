<div class="modal-backdrop" (click)="onBackdropClick()">
  <div class="modal-panel" [class]="'modal-panel--' + size()" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header__text">
        <h3 class="modal-header__title">{{ title() }}</h3>
        @if (subtitle()) {
          <p class="modal-header__subtitle">{{ subtitle() }}</p>
        }
      </div>
      <button type="button" class="modal-close" (click)="close.emit()" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <ng-content />
    </div>

    <!-- Footer (optional) -->
    <ng-content select="[data-modal-footer]" />

  </div>
</div>
